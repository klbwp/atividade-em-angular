<section class="catalogo">
  <div class="introducao">
    <p class="etiqueta">NOSSA SELEÇÃO</p>
    <h1>Encontre seu próximo favorito</h1>
    <p>Veja os produtos e escolha um para conhecer melhor.</p>
  </div>

  <h2>Produtos disponíveis <span>({{ produtos.length }})</span></h2>

  <div class="lista-produtos">
    @for (produto of produtos; track produto.id) {
      <article class="produto">
        <img [src]="produto.imagem" [alt]="produto.nome" />
        <div class="informacoes">
          <span class="categoria">{{ produto.categoria }}</span>
          <h3>{{ produto.nome }}</h3>
          <div class="rodape-produto">
            <p>{{ produto.preco | currency: 'BRL' }}</p>
            <a [routerLink]="['/produto', produto.id]">Ver detalhes <span>→</span></a>
          </div>
        </div>
      </article>
    }
  </div>
</section>
